name: retail
version: "1.0.0"
profile: retail
config-version: 2

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

vars:
  # The extract ends on this date; recency, "active" and RFM are measured as of it.
  analysis_date: "2025-12-31"
  # A customer with no order for this many days is treated as lapsed.
  lapsed_after_days: 365

models:
  retail:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: table
    marts:
      +schema: marts
      +materialized: table
      +grants:
        select: ["metabase_reader"]

seeds:
  retail:
    +schema: reference
